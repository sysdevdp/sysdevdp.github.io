<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../public/image2vector.svg" type="image/x-icon">
    <title>Repository</title>
    <!-- Include Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">    
    <style>
      body {
        font-family: 'IBM Plex Mono', monospace;
        background-color: #1e1e1e;
                color: #333;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin: 0;
        padding: 20px;
        gap: 20px;
        position: relative;  
      }
      .home-icon {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 15px;
        color: #ffffff;
        height: 10px;
        cursor: pointer;
        transition: color 0.3s ease;
        z-index: 100;  
      }
      .home-icon:hover {
        color: #0073e6;
      }

      .section {
        background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(245,245,245,1) 50%, rgba(230,230,230,1) 100%);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 300px;
        font-size: 14px;
        margin-top: 50px; /* Add margin to sections */
        transition: transform 0.3s ease;
      }
      .section:hover {
        transform: translateY(-5px);
      }
      .section.easy {
        border-top: 8px solid #4CAF50;
      }
      .section.medium {
        border-top: 8px solid #FFC107;
      }
      .section.hard {
        border-top: 8px solid #F44336;
      }
      .section-title {
        font-size: 18px;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
        text-align: center;
      }
      .file {
        display: flex;
        align-items: center;
        padding: 5px 0;
        cursor: pointer;
        text-decoration: none;
        color: #555;
        margin-left: 15px;
      }
      .file:hover {
        color: #0073e6;
      }
      .file i {
        margin-right: 10px;
        color: #0073e6;
      }
      .file + .file {
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <a href="/" class="home-icon">
      <i class="fas fa-home"></i>
    </a>

    <div class="section easy" id="easy-section">
      <div class="section-title">Easy LeetCode Problems</div>
      <div class="file-structure" id="easy-structure"></div>
    </div>
    <div class="section medium" id="medium-section">
      <div class="section-title">Medium LeetCode Problems</div>
      <div class="file-structure" id="medium-structure"></div>
    </div>
    <div class="section hard" id="hard-section">
      <div class="section-title">Hard LeetCode Problems</div>
      <div class="file-structure" id="hard-structure"></div>
    </div>

    <script>
      async function renderFileStructure() {
        try {
          const response = await fetch('files.json');
          const files = await response.json();

          const easyStructure = document.getElementById("easy-structure");
          const mediumStructure = document.getElementById("medium-structure");
          const hardStructure = document.getElementById("hard-structure");

          files.forEach(fileItem => {
            const sectionMap = {
              easy: easyStructure,
              medium: mediumStructure,
              hard: hardStructure
            };

            const targetSection = sectionMap[fileItem.difficulty.toLowerCase()];

            if (targetSection) {
              const fileLink = document.createElement("a");
              fileLink.href = fileItem.url;
              fileLink.target = "_blank";
              fileLink.classList.add("file");

              const fileIcon = document.createElement("i");
              fileIcon.classList.add("uim", "uim-file");
              fileLink.appendChild(fileIcon);
              fileLink.appendChild(document.createTextNode(fileItem.name));

              targetSection.appendChild(fileLink);
            }
          });
        } catch (error) {
          console.error("Error fetching file structure:", error);
        }
      }

      window.onload = renderFileStructure;
    </script>
  </body>
</html>
