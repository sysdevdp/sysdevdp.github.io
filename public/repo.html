<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../public/image2vector.svg" type="image/x-icon">
    <title>Repository</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@iconscout/unicons/css/unicons.css" />
    <style>
      body {
        font-family: 'Arial', sans-serif;
        background-color: #f4f7fc;
        color: #333;
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        margin: 0;
        padding: 20px;
      }
      .file-structure {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 300px;
        font-size: 14px;
        margin-right: 30px;
      }
      .folder {
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }
      .folder i {
        margin-right: 8px;
        font-size: 18px;
        color: #0073e6;
      }
      .file {
        display: flex;
        align-items: center;
        padding: 5px 0;
        cursor: pointer;
        text-decoration: none;
        color: #555;
        margin-left: 15px;
      }
      .file:hover {
        color: #0073e6;
      }
      .file i {
        margin-right: 10px;
        color: #0073e6;
      }
      .file + .file {
        margin-top: 5px;
      }
      .file-structure-container {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
    </style>
  </head>
  <body>
    <div class="file-structure-container">
      <div class="file-structure" id="file-structure"></div>
    </div>
    <script>
      async function renderFileStructure() {
        try {
          const response = await fetch('files.json');
          const files = await response.json();
          const fileStructureContainer = document.getElementById("file-structure");
          files.forEach(folder => {
            const folderDiv = document.createElement("div");
            folderDiv.classList.add("folder");
            const folderIcon = document.createElement("i");
            folderIcon.classList.add("uim", "uim-folder");
            folderDiv.appendChild(folderIcon);
            folderDiv.appendChild(document.createTextNode(folder.folderName));
            fileStructureContainer.appendChild(folderDiv);
            folder.files.forEach(file => {
              const fileLink = document.createElement("a");
              fileLink.href = file.url;
              fileLink.target = "_blank";
              fileLink.classList.add("file");
              const fileIcon = document.createElement("i");
              fileIcon.classList.add("uim", "uim-file");
              fileLink.appendChild(fileIcon);
              fileLink.appendChild(document.createTextNode(file.name));
              fileStructureContainer.appendChild(fileLink);
            });
          });
        } catch (error) {
          console.error("Error fetching file structure:", error);
        }
      }
      window.onload = renderFileStructure;
    </script>
  </body>
</html>
